<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a252f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="다산교회" />
  <title>다산교회 | dsc.or.kr</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a252f'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='28' fill='%23d4af37' font-family='sans-serif' font-weight='bold'%3E다산%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: '#2c3e50',
            navyDark: '#1a252f',
            gold: '#d4af37',
            goldLight: '#f6ecc9',
            skyBg: '#f3f6f9'
          },
          fontFamily: {
            sans: ['"Noto Sans KR"', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-skyBg text-slate-800 dark:bg-slate-950 dark:text-slate-100">

  <!-- 1. 초슬림 상단 유틸 바: 실시간 연동됨 + 아이디신청/비번초기화 + 바탕화면 바로가기 -->
  <div class="bg-navyDark dark:bg-black text-white text-[11px] py-1.5 px-3 border-b border-white/10">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-1.5">
      <div class="flex items-center gap-1.5 min-w-0">
        <span id="api-status-dot" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-200 whitespace-nowrap">
          🟡 연동 준비중
        </span>
        <button type="button" onclick="openIdPasswordModal()"
          class="px-2 py-0.5 rounded-full bg-white/10 hover:bg-white/20 text-goldLight font-semibold transition whitespace-nowrap">
          🔑 아이디 신청/비번초기화
        </button>
      </div>
      <button type="button" id="pwa-install-btn" onclick="triggerInstallShortcut()"
        class="px-2 py-0.5 rounded-full bg-gold/20 hover:bg-gold/30 text-gold font-semibold transition whitespace-nowrap shrink-0">
        📲 바로가기
      </button>
    </div>
  </div>

  <!-- 2. 초간결 메인 헤더: [다산] 다산교회 + 10분 세션 타이머/연장 + 테마 + 로그인 -->
  <header class="bg-white/95 dark:bg-slate-900/95 backdrop-blur sticky top-0 z-40 border-b border-gray-200 dark:border-slate-800">
    <div class="max-w-3xl mx-auto px-3.5 h-14 flex items-center justify-between gap-2">
      <a href="#" onclick="switchBottomTab('home'); return false;" class="flex items-center gap-2 shrink-0">
        <div class="w-8 h-8 rounded-lg bg-navy dark:bg-slate-800 border border-transparent dark:border-gold/40 flex items-center justify-center text-gold font-bold text-xs shadow-sm">
          다산
        </div>
        <span class="text-lg font-bold text-navy dark:text-white tracking-tight">다산교회</span>
      </a>

      <div class="flex items-center gap-1.5">
        <!-- 로그인 시 노출: 10분 세션 타이머 + 연장하기 -->
        <div id="session-timer-box" class="hidden items-center gap-1 bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700/50 rounded-lg px-2 py-1 text-[11px]">
          <span class="text-amber-700 dark:text-amber-300 font-mono font-bold">⏱ <span id="session-countdown">10:00</span></span>
          <button type="button" onclick="handleExtendSession()"
            class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-1.5 py-0.5 rounded text-[10px] transition">
            연장
          </button>
        </div>

        <!-- 시연용 5단계 권한 빠른 전환 버튼 (목사님/직원 시연 편의용) -->
        <button type="button" onclick="openRoleDemoModal()" title="5단계 권한 시연"
          class="w-8 h-8 rounded-lg border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 flex items-center justify-center text-sm hover:bg-gray-100 dark:hover:bg-slate-700 transition">
          🎭
        </button>

        <!-- 밝음/어두움 토글 -->
        <button type="button" id="theme-toggle-btn" onclick="toggleTheme()" aria-label="화면 테마 전환"
          class="w-8 h-8 rounded-lg border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 flex items-center justify-center text-sm hover:bg-gray-100 dark:hover:bg-slate-700 transition">
          <span id="theme-icon">🌙</span>
        </button>

        <!-- Google 로그인 / 로그아웃 -->
        <button type="button" id="auth-btn" onclick="handleAuthClick()"
          class="bg-navy hover:bg-navyDark dark:bg-gold dark:hover:bg-yellow-500 text-white dark:text-navyDark text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-sm whitespace-nowrap">
          로그인
        </button>
      </div>
    </div>
  </header>

  <!-- 3. 메인 콘텐츠 뷰포트 (탭 전환형 앱 구조) -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-3.5 py-4 space-y-4">

    <!-- [TAB 1] 홈 화면: 기본(활동사진) + 확장(로그인 성도 이상: 나의 신앙 대시보드) -->
    <section id="tab-view-home" class="space-y-4">

      <!-- 다음 예배 1줄 미니 알림 바 -->
      <div class="flex items-center justify-between bg-white dark:bg-slate-900 rounded-xl px-3.5 py-2 shadow-sm border border-gray-200/80 dark:border-slate-800 text-xs">
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="text-gold">🔔</span>
          <span id="next-worship-label" class="font-semibold text-gray-700 dark:text-slate-200 truncate">다음 예배까지</span>
          <span id="worship-countdown" class="font-mono font-bold text-navy dark:text-gold">00:00:00</span>
        </div>
        <a href="https://www.youtube.com/@sda5239" target="_blank"
          class="text-[11px] font-bold text-red-600 dark:text-red-400 hover:underline shrink-0">
          ▶ 온라인예배
        </a>
      </div>

      <!-- 기본 영역 (권한: 외부인 이상 전체 노출) — 활동사진 정방향/역방향 심플 슬라이더 -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl overflow-hidden shadow-sm border border-gray-200/80 dark:border-slate-800">
        <div id="gallery-slider-stage" class="relative aspect-[16/10] sm:aspect-[16/9] bg-navyDark overflow-hidden select-none">
          <img id="hero-gallery-img" src="" alt="다산교회 활동사진"
            class="w-full h-full object-cover transition-opacity duration-300" />
          <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/75 via-black/30 to-transparent p-3.5 pt-10 flex items-end justify-between gap-2">
            <div class="min-w-0">
              <div id="hero-gallery-caption" class="text-white font-bold text-sm truncate">다산교회 활동사진</div>
              <div id="hero-gallery-sub" class="text-white/80 text-[11px] truncate">함께 예배하고 섬기는 다산교회 공동체</div>
            </div>
            <span id="hero-gallery-counter" class="text-[11px] font-mono bg-black/50 text-white px-2 py-0.5 rounded-full shrink-0">1 / 3</span>
          </div>

          <!-- 좌/우 수동 이동 버튼 -->
          <button type="button" onclick="stepGallerySlide(-1)" aria-label="이전 사진"
            class="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/40 hover:bg-black/60 text-white flex items-center justify-center text-sm transition">
            ◀
          </button>
          <button type="button" onclick="stepGallerySlide(1)" aria-label="다음 사진"
            class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/40 hover:bg-black/60 text-white flex items-center justify-center text-sm transition">
            ▶
          </button>
        </div>

        <!-- 심플 정방향 / 정지 / 역방향 슬라이드 컨트롤 바 -->
        <div class="px-3.5 py-2.5 flex items-center justify-between gap-2 bg-gray-50/80 dark:bg-slate-900 border-t border-gray-100 dark:border-slate-800">
          <div class="inline-flex items-center gap-1 bg-white dark:bg-slate-800 p-0.5 rounded-lg border border-gray-200 dark:border-slate-700">
            <button type="button" id="btn-dir-rev" onclick="setGalleryDirection(-1)"
              class="px-2.5 py-1 rounded-md text-[11px] font-bold text-gray-600 dark:text-slate-300 transition">
              ◀ 역방향
            </button>
            <button type="button" id="btn-dir-pause" onclick="setGalleryDirection(0)"
              class="px-2 py-1 rounded-md text-[11px] font-bold text-gray-600 dark:text-slate-300 transition">
              ⏸
            </button>
            <button type="button" id="btn-dir-fwd" onclick="setGalleryDirection(1)"
              class="px-2.5 py-1 rounded-md text-[11px] font-bold bg-navy text-white dark:bg-gold dark:text-navyDark transition">
              정방향 ▶
            </button>
          </div>
          <a href="https://drive.google.com/drive/folders/1m99CZXmlIA1SV2rRrxCWoTaLoXA1P6ud" target="_blank"
            class="text-[11px] font-semibold text-navy dark:text-gold hover:underline">
            전체 앨범 →
          </a>
        </div>
      </div>

      <!-- 확장 영역: 비로그인(간결한 로그인 안내) vs 성도(Lv.2) 이상(나의 신앙 대시보드) -->
      <div id="personalized-card"></div>

    </section>

    <!-- [TAB 2] 예배·예약 뷰 -->
    <section id="tab-view-worship" class="hidden space-y-3"></section>

    <!-- [TAB 3] 전체업무 (클래스화된 업무 카테고리 맵) -->
    <section id="tab-view-work" class="hidden space-y-3"></section>

    <!-- [TAB 4] 말씀·주보·일정 뷰 -->
    <section id="tab-view-bulletin" class="hidden space-y-3"></section>

    <!-- [TAB 5] 내정보 & 설정 & 5단계 권한 시연 -->
    <section id="tab-view-my" class="hidden space-y-3"></section>

  </main>

  <!-- 4. 하단 고정식 네비게이션 바 (Bottom Fixed Navigation) -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-gray-200 dark:border-slate-800 safe-bottom shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
    <div class="max-w-3xl mx-auto grid grid-cols-5 h-16">
      <button type="button" data-tab="home" onclick="switchBottomTab('home')"
        class="bottom-nav-btn flex flex-col items-center justify-center gap-0.5 text-navy dark:text-gold font-bold transition">
        <span class="text-lg leading-none">🏠</span>
        <span class="text-[10px]">홈</span>
      </button>
      <button type="button" data-tab="worship" onclick="switchBottomTab('worship')"
        class="bottom-nav-btn flex flex-col items-center justify-center gap-0.5 text-gray-500 dark:text-slate-400 font-medium transition">
        <span class="text-lg leading-none">📅</span>
        <span class="text-[10px]">예배·예약</span>
      </button>
      <button type="button" data-tab="work" onclick="switchBottomTab('work')"
        class="bottom-nav-btn flex flex-col items-center justify-center gap-0.5 text-gray-500 dark:text-slate-400 font-medium transition">
        <span class="text-lg leading-none">🧩</span>
        <span class="text-[10px]">전체업무</span>
      </button>
      <button type="button" data-tab="bulletin" onclick="switchBottomTab('bulletin')"
        class="bottom-nav-btn flex flex-col items-center justify-center gap-0.5 text-gray-500 dark:text-slate-400 font-medium transition">
        <span class="text-lg leading-none">📄</span>
        <span class="text-[10px]">말씀·주보</span>
      </button>
      <button type="button" data-tab="my" onclick="switchBottomTab('my')"
        class="bottom-nav-btn flex flex-col items-center justify-center gap-0.5 text-gray-500 dark:text-slate-400 font-medium transition">
        <span class="text-lg leading-none">👤</span>
        <span class="text-[10px]">내정보</span>
      </button>
    </div>
  </nav>

  <!-- 5. 공통 업무 클래스 실행 모달 -->
  <div id="service-modal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-[1px] flex items-end sm:items-center justify-center sm:p-4">
    <div class="bg-white dark:bg-slate-900 rounded-t-2xl sm:rounded-2xl max-w-2xl w-full max-h-[88vh] overflow-y-auto shadow-2xl border border-gray-200 dark:border-slate-700">
      <div class="sticky top-0 z-10 bg-white dark:bg-slate-900 px-4 py-3.5 border-b border-gray-200 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2 min-w-0">
          <span id="modal-icon" class="text-xl shrink-0">📌</span>
          <div class="min-w-0">
            <h3 id="modal-title" class="font-bold text-sm sm:text-base text-navy dark:text-white truncate">업무 제목</h3>
            <p id="modal-subtitle" class="text-[11px] text-gray-500 dark:text-slate-400 truncate">연동 정보</p>
          </div>
        </div>
        <button type="button" onclick="closeServiceModal()" class="text-gray-400 hover:text-gray-700 dark:hover:text-white text-xl font-bold px-2">✕</button>
      </div>
      <div id="modal-body" class="p-4 space-y-4 text-xs sm:text-sm"></div>
    </div>
  </div>

  <!-- 6. 토스트 알림 -->
  <div id="portal-toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-[60] hidden bg-navyDark text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg border border-white/10"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
